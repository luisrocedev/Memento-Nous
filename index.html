<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Nous · Memorias semánticas</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <main class="shell">
    <section class="panel header">
      <div>
        <h1>Memento Nous</h1>
        <p>Proyecto de recuerdos semánticos con relaciones, conjuntos y visualización de nodos en 2D y 3D.</p>
      </div>
      <div class="actions">
        <button id="addMemoryBtn">+ Nuevo recuerdo</button>
        <button id="resetDbBtn" class="secondary">Reset BD</button>
      </div>
    </section>

    <section class="panel controls">
      <div class="row row-4">
        <label>Búsqueda global
          <input id="searchInput" placeholder="Buscar por título, texto, lugar, personas o tags...">
        </label>
        <label>Filtrar emoción
          <select id="emotionFilter">
            <option value="all">Todas</option>
            <option value="alegria">Alegría</option>
            <option value="nostalgia">Nostalgia</option>
            <option value="orgullo">Orgullo</option>
            <option value="tristeza">Tristeza</option>
            <option value="sorpresa">Sorpresa</option>
          </select>
        </label>
        <label>Vista grafo
          <select id="graphMode">
            <option value="2d">2D</option>
            <option value="3d">3D</option>
          </select>
        </label>
        <label>Agrupar por
          <select id="groupBy">
            <option value="emotion">Emoción</option>
            <option value="tag">Tag principal</option>
            <option value="person">Persona principal</option>
            <option value="year">Año</option>
          </select>
        </label>
      </div>
      <div class="stats" id="statsBox"></div>
    </section>

    <section class="grid-2">
      <article class="panel">
        <h2>Mapa semántico de recuerdos</h2>
        <div id="graph2DWrap" class="graph-wrap">
          <canvas id="graph2D" width="900" height="500"></canvas>
        </div>
        <div id="graph3DWrap" class="graph-wrap hidden">
          <div id="graph3D"></div>
        </div>
      </article>

      <article class="panel">
        <h2>Recuerdos guardados</h2>
        <div id="memoryList" class="list"></div>
      </article>
    </section>

    <section class="panel">
      <h2>Conjuntos (sets) de recuerdos</h2>
      <div class="actions">
        <button id="buildSetsBtn" class="secondary">Recalcular sets</button>
      </div>
      <div id="setsList" class="sets"></div>
    </section>
  </main>

  <dialog id="memoryDialog" class="dialog">
    <form id="memoryForm" method="dialog" class="dialog-form">
      <header>
        <h3>Nuevo recuerdo</h3>
      </header>

      <label>Título
        <input id="memTitle" required maxlength="120" placeholder="Primer día de prácticas">
      </label>

      <div class="row">
        <label>Fecha
          <input id="memDate" type="date" required>
        </label>
        <label>Lugar
          <input id="memPlace" maxlength="120" placeholder="Valencia">
        </label>
      </div>

      <div class="row">
        <label>Emoción
          <select id="memEmotion" required>
            <option value="alegria">Alegría</option>
            <option value="nostalgia">Nostalgia</option>
            <option value="orgullo">Orgullo</option>
            <option value="tristeza">Tristeza</option>
            <option value="sorpresa">Sorpresa</option>
          </select>
        </label>
        <label>Personas (coma separada)
          <input id="memPeople" placeholder="Ana, Luis, Profesor">
        </label>
      </div>

      <label>Tags semánticos (coma separada)
        <input id="memTags" placeholder="aprendizaje, trabajo, equipo">
      </label>

      <label>Descripción del recuerdo
        <textarea id="memText" rows="5" required placeholder="Describe el recuerdo con contexto y detalles..."></textarea>
      </label>

      <div class="actions">
        <button type="submit">Guardar</button>
        <button type="button" id="cancelDialogBtn" class="secondary">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="assets/app.js"></script>
</body>
</html>
